version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: traceops_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    restart: unless-stopped

  payment:
    build:
      context: ./services/payment
    container_name: traceops_payment
    ports:
      - "8002:8002"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    restart: unless-stopped

  checkout:
    build:
      context: ./services/checkout
    container_name: traceops_checkout
    ports:
      - "8001:8001"
    depends_on:
      - payment
    environment:
      PAYMENT_HOST: payment
      PAYMENT_PORT: 8002
    restart: unless-stopped
